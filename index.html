<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles/coolstyles.css" rel="stylesheet">
    <title>Week 5 - CSS Animations and Transitions</title>
</head>
<body>
    <!--
    prompt:
    Add a div with the class container, and inside add a 
    header, nav, main, and footer. Do not add any placeholder
    content or delete any current content. -->
    <div class="container">
        <header>
            <h1>CSS Transitions and Animations</h1>
        </header>
        <nav></nav>
        <main>
            <!-- prompt to set up the grid...
             For the main, use CSS in the CSS file to create a 5 column grid
             For the first row of the grid, add 5 divs and in CSS style them to be
             80px squares with light blue backgrounds
             Repeat this for the second row of the grid
             For the third row, add 3 divs and style them as 80px wide by 25px high
             with light green backgrounds - but start the first div in the second
             column of the grid 
             Include 10px padding for each div
             Do not add any placeholder content or remove any content in the main -->
              <div class="grid-blue">No Transform</div>
              <div class="grid-blue">Translate</div>
              <div class="grid-blue">Rotate</div>
              <div class="grid-blue">Scale</div>
              <div class="grid-blue">Skew</div>
              <div class="grid-blue">No Animation</div>
              <div class="grid-blue">Transition</div>
              <div class="grid-blue">Transition Rotation</div>
              <div class="grid-blue">Transition All</div>
              <div class="grid-blue">Key Frames</div>
              <div class="btn grid-green grid-start">Home</div>
              <div class="btn grid-green">Stuff</div>
              <div class="btn grid-green">Click Me</div>
        </main>
        <footer></footer>
    </div>
</body>
</html>
